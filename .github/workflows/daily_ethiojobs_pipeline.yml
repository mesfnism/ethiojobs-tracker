name: Daily Jobs Pipeline (EthioJobs + HaHuJobs)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Run EthioJobs pipeline
        run: python ethiojobs_pipeline.py

      - name: Run HaHuJobs pipeline
        run: python hahujobs_pipeline.py

      - name: Combine trackers and dedup cross-posted vacancies
        run: python combine_trackers.py

      - name: Build dashboard data (daily / weekly / monthly / quarterly / yearly rollups)
        run: python rollup_ethiojobs.py

      - name: Commit updated trackers and dashboard data back to the repo
        run: |
          git config user.name "jobs-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ethiojobs_tracker.xlsx hahujobs_tracker.xlsx combined_tracker.xlsx docs/data/rollups.json
          git diff --quiet --cached || git commit -m "Daily jobs update $(date -u +%Y-%m-%d)"
          git push
