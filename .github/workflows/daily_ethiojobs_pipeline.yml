name: Daily Jobs Pipeline (EthioJobs + HaHuJobs + ReporterJobs + PalmJobs + DevNetJobs + HarmeeJobs + ElelanaJobs + KebenaJobs + Afriworket + GeezJobs)

permissions:
  contents: write

# One consolidated workflow covering both job boards, run entirely
# sequentially with a single commit at the end. This used to be two
# separate offset workflows (one per site) — consolidated into one so the
# combine/dedup step always runs after BOTH sites have finished scraping,
# and so there is only ever one commit per day (two competing workflows
# racing to push caused a real, one-off failed run previously).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      # continue-on-error: true on every per-source step below (added
      # 2026-10-02): reporterjobs_pipeline.py and palmjobs_pipeline.py now
      # correctly exit(1) on a real failure instead of silently writing an
      # empty-looking tracker — but GitHub Actions' default behavior is to
      # stop the whole job at the first failed step, which would mean ONE
      # blocked source (ReporterJobs, currently) takes down all 11 other
      # sources, the combine step, the dashboard rebuild, and the reports
      # with it, every single day. continue-on-error lets each source fail
      # independently without blocking its neighbors; the step still shows
      # as failed in the Actions UI (a yellow warning triangle) so it's not
      # silently swallowed, and source_health.py's reliability scorecard
      # plus the intelligence report's own data-quality section are the
      # real, honest record of which sources are and aren't working — not
      # the job's overall green/red status.
      - name: Run EthioJobs pipeline
        continue-on-error: true
        run: python ethiojobs_pipeline.py

      - name: Run HaHuJobs pipeline
        continue-on-error: true
        run: python hahujobs_pipeline.py

      - name: Run Ethiopian Reporter Jobs pipeline
        continue-on-error: true
        run: python reporterjobs_pipeline.py

      - name: Run PalmJobs pipeline
        continue-on-error: true
        run: python palmjobs_pipeline.py

      - name: Run DevNetJobs pipeline (Ethiopia-filtered)
        continue-on-error: true
        run: python devnetjobs_pipeline.py

      - name: Run HarmeeJobs pipeline
        continue-on-error: true
        run: python harmeejobs_pipeline.py

      - name: Run ElelanaJobs pipeline
        continue-on-error: true
        run: python elelanajobs_pipeline.py

      - name: Run KebenaJobs pipeline
        continue-on-error: true
        run: python kebenajobs_pipeline.py

      - name: Run Afriworket pipeline
        continue-on-error: true
        run: python afriworket_pipeline.py

      - name: Run GeezJobs pipeline
        continue-on-error: true
        run: python geezjobs_pipeline.py

      - name: Run ReliefWeb pipeline (Ethiopia-filtered, via the ReliefWeb API)
        continue-on-error: true
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python reliefweb_pipeline.py

      # No automated step for X runs here. x_jobs_tracker.xlsx is built by
      # x_grok_pipeline.py, run manually whenever a new Grok search is done
      # (see that script's docstring), and committed to the repo by hand.
      # This workflow still picks up whatever is already checked in when it
      # combines trackers below, it just never regenerates that one itself.

      - name: Combine trackers and dedup cross-posted vacancies
        run: python combine_trackers.py

      - name: Build dashboard data (daily / weekly / monthly / quarterly / yearly rollups)
        run: python rollup_ethiojobs.py

      - name: Build per-source reliability scorecard
        run: python source_health.py

      - name: Build the Vacancy and Skill Intelligence Reports (weekly + monthly)
        run: python generate_intelligence_report.py

      - name: Commit updated trackers, dashboard data and reports back to the repo
        run: |
          git config user.name "jobs-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ethiojobs_tracker.xlsx hahujobs_tracker.xlsx reporterjobs_tracker.xlsx palmjobs_tracker.xlsx devnetjobs_tracker.xlsx harmeejobs_tracker.xlsx elelanajobs_tracker.xlsx kebenajobs_tracker.xlsx afriworket_tracker.xlsx geezjobs_tracker.xlsx reliefweb_tracker.xlsx x_jobs_tracker.xlsx combined_tracker.xlsx docs/data/rollups.json docs/data/source_health.json docs/data/report_history.json docs/reports/weekly-intelligence-report.html docs/reports/monthly-intelligence-report.html docs/reports/weekly-intelligence-report.pdf docs/reports/monthly-intelligence-report.pdf
          git diff --quiet --cached || git commit -m "Daily jobs update $(date -u +%Y-%m-%d)"
          git push
