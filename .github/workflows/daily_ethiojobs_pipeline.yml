name: Daily Jobs Pipeline (EthioJobs + HaHuJobs + ReporterJobs + PalmJobs + DevNetJobs + HarmeeJobs)

permissions:
  contents: write

# One consolidated workflow covering both job boards, run entirely
# sequentially with a single commit at the end. This used to be two
# separate offset workflows (one per site) — consolidated into one so the
# combine/dedup step always runs after BOTH sites have finished scraping,
# and so there is only ever one commit per day (two competing workflows
# racing to push caused a real, one-off failed run previously).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Run EthioJobs pipeline
        run: python ethiojobs_pipeline.py

      - name: Run HaHuJobs pipeline
        run: python hahujobs_pipeline.py

      - name: Run Ethiopian Reporter Jobs pipeline
        run: python reporterjobs_pipeline.py

      - name: Run PalmJobs pipeline
        run: python palmjobs_pipeline.py

      - name: Run DevNetJobs pipeline (Ethiopia-filtered)
        run: python devnetjobs_pipeline.py

      - name: Run HarmeeJobs pipeline
        run: python harmeejobs_pipeline.py

      - name: Combine trackers and dedup cross-posted vacancies
        run: python combine_trackers.py

      - name: Build dashboard data (daily / weekly / monthly / quarterly / yearly rollups)
        run: python rollup_ethiojobs.py

      - name: Build the Vacancy and Skill Intelligence Reports (weekly + monthly)
        run: python generate_intelligence_report.py

      - name: Commit updated trackers, dashboard data and reports back to the repo
        run: |
          git config user.name "jobs-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ethiojobs_tracker.xlsx hahujobs_tracker.xlsx reporterjobs_tracker.xlsx palmjobs_tracker.xlsx devnetjobs_tracker.xlsx harmeejobs_tracker.xlsx combined_tracker.xlsx docs/data/rollups.json docs/data/report_history.json docs/reports/weekly-intelligence-report.html docs/reports/monthly-intelligence-report.html
          git diff --quiet --cached || git commit -m "Daily jobs update $(date -u +%Y-%m-%d)"
          git push
