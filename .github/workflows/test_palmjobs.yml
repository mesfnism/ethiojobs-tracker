name: PalmJobs Pipeline (manual test run)

permissions:
  contents: write

# A standalone, on-demand workflow for PalmJobs only. Use this to test or
# re-test the pipeline (e.g. after the 2026-10-02 curl_cffi rewrite and its
# 429-retry fix) without waiting for or disturbing the full
# daily_ethiojobs_pipeline.yml run, which also scrapes 10 other sources,
# combines trackers, rebuilds the dashboard, and regenerates the
# intelligence reports. Trigger it from GitHub -> Actions -> "PalmJobs
# Pipeline (manual test run)" -> Run workflow. It is NOT on a schedule — it
# only runs when you click that button, so it never duplicates or races
# with the daily workflow.
on:
  workflow_dispatch: {}

jobs:
  run-palmjobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No "Install Playwright's Chromium" step here — the 2026-10-02
      # rewrite replaced the Playwright/CDP-driven browser with curl_cffi
      # (TLS-fingerprint-impersonating plain HTTP) + BeautifulSoup, the
      # same fix already applied to reporterjobs_pipeline.py, because
      # Playwright's automation protocol itself was the likely thing
      # getting blocked on GitHub Actions specifically (see
      # palmjobs_pipeline.py's module docstring). This run is also useful
      # evidence either way: a clean run here confirms the fix works from
      # Actions' own runners, not just locally.

      - name: Run offline parser/credential-discovery/retry tests first
        run: python test_offline_palmjobs.py

      - name: Run PalmJobs pipeline against the live site
        run: python palmjobs_pipeline.py

      - name: Commit updated tracker, if anything changed
        run: |
          git config user.name "jobs-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add palmjobs_tracker.xlsx
          git diff --quiet --cached || git commit -m "PalmJobs manual test run $(date -u +%Y-%m-%d)"
          git push
